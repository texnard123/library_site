<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гра: Міф чи правда? | Сучасні бібліотеки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --primary: #22A06B;
            --primary-hover: #1e8b5d;
            --secondary: #2D7FF9;
            --correct: #16A34A;
            --correct-bg: #DCFCE7;
            --incorrect: #EF4444;
            --incorrect-bg: #FEE2E2;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --fact-bg: #F0FDF4;
            --border-radius: 24px;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 10px 30px -10px rgba(31, 41, 55, 0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            width: 100%;
            max-width: 600px;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-main);
            transition: var(--transition);
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-icon {
            background-color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(34, 160, 107, 0.2);
        }

        .header-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #FFF;
            stroke-width: 2;
        }

        .progress-section {
            padding: 0 24px 24px;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: block;
            text-align: center;
        }

        .progress-bar-bg {
            height: 6px;
            background-color: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        main {
            flex: 1;
            padding: 0 24px 40px;
            display: flex;
            flex-direction: column;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(0,0,0,0.03);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .illustration {
            width: 160px;
            height: 160px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-main);
            margin-bottom: 12px;
            animation: fadeIn 0.3s ease;
        }

        .feedback-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .feedback-icon-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        
        .feedback-icon-wrapper.correct { background-color: var(--correct-bg); color: var(--correct); }
        .feedback-icon-wrapper.incorrect { background-color: var(--incorrect-bg); color: var(--incorrect); }
        
        .feedback-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        
        .feedback-title.correct { color: var(--correct); }
        .feedback-title.incorrect { color: var(--incorrect); }

        .explanation {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .fact-card {
            background-color: var(--fact-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 0;
            transform: translateY(15px);
            animation: slideUpFade 0.4s ease 0.2s forwards;
        }

        .fact-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fact-icon {
            width: 36px;
            height: 36px;
            background-color: #DCFCE7;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
        }

        .fact-title {
            font-size: 16px;
            font-weight: 700;
            color: #166534;
        }

        .fact-text {
            font-size: 15px;
            line-height: 1.5;
            color: #14532D;
        }

        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 18px 16px;
            border-radius: 20px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1) !important;
        }

        .btn-myth {
            background-color: var(--incorrect-bg);
            color: #B91C1C;
        }
        .btn-myth:not(:disabled):hover { background-color: #FECACA; }

        .btn-truth {
            background-color: var(--correct-bg);
            color: #15803D;
        }
        .btn-truth:not(:disabled):hover { background-color: #BBF7D0; }

        .btn-next, .btn-start {
            background-color: var(--primary);
            color: #FFF;
            width: 100%;
            display: none;
            box-shadow: 0 8px 20px rgba(34, 160, 107, 0.2);
            animation: slideUpFade 0.3s ease forwards;
            padding: 18px 16px;
            border-radius: 20px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-start { display: flex; animation: none; }

        .btn-next:hover, .btn-start:hover { background-color: var(--primary-hover); }
        .btn-start:active { transform: scale(0.95); }

        #start-view {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 0 24px 40px;
        }
        
        #quiz-view {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        #result-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #064E3B;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            padding: 32px;
            color: #FFF;
        }

        .trophy {
            width: 180px;
            height: 180px;
            margin-bottom: 24px;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .result-score {
            font-size: 56px;
            font-weight: 800;
            color: #FDE047;
            margin-bottom: 16px;
            text-shadow: 0 4px 12px rgba(253, 224, 71, 0.2);
        }

        .result-subtitle {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 32px;
            color: #D1FAE5;
        }

        .badge {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            padding: 12px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 40px;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .result-btn {
            background-color: #FFF;
            color: #064E3B;
            width: 100%;
            max-width: 320px;
            padding: 18px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            margin-bottom: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .result-btn.secondary {
            background-color: rgba(255,255,255,0.15);
            color: #FFF;
        }

        .result-btn:active { transform: scale(0.96); }

        .result-back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            background: none;
            border: none;
            cursor: pointer;
            color: #FFF;
            z-index: 102;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .result-back-btn:active { transform: scale(0.9); }
        
        .result-back-btn svg { 
            width: 24px; 
            height: 24px; 
            stroke: currentColor; 
            stroke-width: 2.5; 
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { opacity: 1; transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
        }

        .svg-flat { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <a href="#" class="back-btn" aria-label="Повернутися" onclick="handleBack(event)">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </a>
        <h1 class="title">Міф чи правда?</h1>
        <div class="header-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>
    </header>

    <div id="start-view">
        <div class="card" style="margin: auto 0;">
            <div class="illustration" style="width: 180px; height: 180px;">
                <svg viewBox="0 0 200 200" class="svg-flat">
                    <!-- Minimalist Bookshelf/Books Concept -->
                    <circle cx="100" cy="100" r="80" fill="#F0FDF4" />
                    <rect x="60" y="70" width="30" height="60" rx="4" fill="#22A06B" />
                    <rect x="95" y="50" width="30" height="80" rx="4" fill="#2D7FF9" />
                    <rect x="130" y="80" width="30" height="50" rx="4" fill="#E2E8F0" />
                    <line x1="40" y1="135" x2="160" y2="135" stroke="#22A06B" stroke-width="8" stroke-linecap="round"/>
                </svg>
            </div>
            
            <h2 class="question-text" style="font-size: 24px; margin-bottom: 12px;">Готові перевірити свої знання?</h2>
            <p class="explanation" style="margin-bottom: 32px; font-size: 15px;">
                Дізнайтеся, що із тверджень про сучасні українські бібліотеки є правдою, а що — лише застарілим стереотипом.
            </p>

            <button class="btn-start" onclick="startGame()">
                Почати гру
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <div id="quiz-view">
        <div class="progress-section">
            <span class="progress-text" id="progress-text">Питання 1 із 10</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <main>
            <div class="card">
                <div class="illustration" id="illustration-container">
                    <!-- Dynamic SVG inserted here -->
                </div>
                
                <h2 class="question-text" id="question-text">Завантаження...</h2>

                <!-- Feedback Area -->
                <div class="feedback-container" id="feedback-container">
                    <div class="feedback-icon-wrapper" id="feedback-icon"></div>
                    <h3 class="feedback-title" id="feedback-title">Правильно!</h3>
                    <p class="explanation" id="explanation-text"></p>

                    <div class="fact-card">
                        <div class="fact-header">
                            <div class="fact-icon">
                                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 18h6"></path>
                                    <path d="M10 22h4"></path>
                                    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>
                                </svg>
                            </div>
                            <span class="fact-title">Цікавий факт</span>
                        </div>
                        <p class="fact-text" id="fact-text"></p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls" id="controls">
                <button class="btn btn-myth" onclick="handleAnswer(false)" id="btn-myth">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    Міф
                </button>
                <button class="btn btn-truth" onclick="handleAnswer(true)" id="btn-truth">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
                    Правда
                </button>
            </div>
            <button class="btn btn-next" onclick="nextQuestion()" id="btn-next" style="display: none;">Наступне питання →</button>
        </main>
    </div>

    <div id="result-view">
        <button class="result-back-btn" aria-label="Повернутися" onclick="handleBack(event)">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <canvas id="confetti"></canvas>
        <div class="trophy">
            <svg viewBox="0 0 200 200" fill="none" class="svg-flat">
                <!-- Flat Trophy -->
                <path d="M100 160V130" stroke="#FDE047" stroke-width="16" stroke-linecap="round"/>
                <path d="M70 160H130" stroke="#FDE047" stroke-width="16" stroke-linecap="round"/>
                <path d="M50 50H150V90C150 117.614 127.614 140 100 140C72.3858 140 50 117.614 50 90V50Z" fill="#FDE047"/>
                <path d="M50 60H30C24.4772 60 20 64.4772 20 70C20 86.5685 33.4315 100 50 100H55" stroke="#FDE047" stroke-width="12" stroke-linecap="round"/>
                <path d="M150 60H170C175.523 60 180 64.4772 180 70C180 86.5685 166.569 100 150 100H145" stroke="#FDE047" stroke-width="12" stroke-linecap="round"/>
                <circle cx="100" cy="90" r="15" fill="#CA8A04"/>
            </svg>
        </div>
        <h2 class="result-title">Вітаємо!</h2>
        <div class="result-score" id="final-score">10 із 10</div>
        <p class="result-subtitle" id="result-subtitle">Ви справжній знавець сучасних бібліотек!</p>
        <div class="badge" id="result-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 15l-3 3m0 0l-3-3m3 3V9m6 6l3 3m0 0l3-3m-3 3V9M3 4h18v4H3z"/></svg>
            Хранитель знань
        </div>
        <button class="result-btn" onclick="resetGame()">Пройти ще раз</button>
        <button class="result-btn secondary" onclick="showStartScreen()" style="margin-top: 8px;">На головну</button>
    </div>
</div>

        e.preventDefault();
        // Якщо ми на стартовому екрані, стрілочка веде на головну сторінку сайту

    function startGame() {
        currentQuestionIndex = 0;

        startView.style.display = 'none';

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        
        qText.style.display = 'block';
        feedbackContainer.style.display = 'none';
        controls.style.display = 'flex';
        btnNext.style.display = 'none';
        btnMyth.disabled = false;
        btnTruth.disabled = false;
        
        qText.innerText = q.text;
        illustrationContainer.innerHTML = q.illustration;
        
        const qNum = currentQuestionIndex + 1;
        progressText.innerText = `Питання ${qNum} із ${questions.length}`;
        progressBar.style.width = `${(qNum / questions.length) * 100}%`;
    }

    function handleAnswer(userChoiceIsTrue) {
        const q = questions[currentQuestionIndex];
        const isCorrect = userChoiceIsTrue === q.isTrue;
        
        if (isCorrect) score++;

        btnMyth.disabled = true;
        btnTruth.disabled = true;

        qText.style.display = 'none';

        feedbackIcon.className = `feedback-icon-wrapper ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackIcon.innerHTML = isCorrect ? iconCorrectSVG : iconIncorrectSVG;
        
        feedbackTitle.className = `feedback-title ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackTitle.innerText = isCorrect ? "Правильно!" : "Не зовсім…";
        
        explanationText.innerText = q.explanation;
        factText.innerText = q.factText;

        controls.style.display = 'none';
        feedbackContainer.style.display = 'flex';
        btnNext.style.display = 'flex';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex >= questions.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    function triggerConfetti() {
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#FDE047', '#22A06B', '#2D7FF9', '#EF4444', '#FFFFFF'];

        for (let i = 0; i < 80; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: Math.random() * 3 + 3,
                vx: Math.random() * 2 - 1,
                rot: Math.random() * 360,
                rotSpeed: Math.random() * 5 - 2.5
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            pieces.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                p.rot += p.rotSpeed;
                if (p.y < canvas.height) active = true;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });

            if (active) {
                requestAnimationFrame(update);
            }
        }
        update();
    }

    // Start App on Load
    window.onload = showStartScreen;
