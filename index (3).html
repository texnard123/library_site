<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Міф чи правда? | Сучасні бібліотеки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --primary: #22A06B;
            --primary-hover: #1e8b5d;
            --secondary: #2D7FF9;
            --correct: #16A34A;
            --correct-bg: #DCFCE7;
            --incorrect: #EF4444;
            --incorrect-bg: #FEE2E2;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --fact-bg: #E0F2FE;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --border-radius: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #app {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .menu-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-main);
            stroke-width: 2.5;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .book-icon-wrapper {
            background-color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(34, 160, 107, 0.3);
        }

        .book-icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #FFF;
            stroke-width: 2;
        }

        /* --- PROGRESS --- */
        .progress-section {
            padding: 0 24px 20px;
        }

        .progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
        }

        .progress-bar-bg {
            height: 6px;
            background-color: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease-out;
        }

        /* --- MAIN CARD --- */
        main {
            flex: 1;
            padding: 0 24px 30px;
            display: flex;
            flex-direction: column;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            margin-bottom: 24px;
            transition: var(--transition);
        }

        .illustration {
            width: 140px;
            height: 140px;
            margin-bottom: 24px;
        }

        .question-text {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
        }

        /* --- FEEDBACK & FACT --- */
        .feedback-container {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            width: 100%;
        }

        .feedback-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        
        .feedback-icon.correct { background-color: var(--correct-bg); color: var(--correct); }
        .feedback-icon.incorrect { background-color: var(--incorrect-bg); color: var(--incorrect); }
        
        .feedback-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .feedback-title.correct { color: var(--correct); }
        .feedback-title.incorrect { color: var(--incorrect); }

        .explanation {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .fact-card {
            background-color: var(--fact-bg);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpFade 0.5s ease 0.2s forwards;
        }

        .fact-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fact-icon {
            width: 32px;
            height: 32px;
            background-color: #BAE6FD;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary);
        }

        .fact-title {
            font-size: 16px;
            font-weight: 700;
            color: #0369A1;
        }

        .fact-text {
            font-size: 14px;
            line-height: 1.5;
            color: #0C4A6E;
        }

        /* --- BUTTONS --- */
        .controls {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 18px 16px;
            border-radius: 20px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-myth {
            background-color: var(--incorrect-bg);
            color: #B91C1C;
        }

        .btn-truth {
            background-color: var(--correct-bg);
            color: #15803D;
        }

        .btn-next {
            background-color: var(--primary);
            color: #FFF;
            width: 100%;
            display: none;
            box-shadow: 0 8px 20px rgba(34, 160, 107, 0.25);
            animation: slideUpFade 0.3s ease forwards;
        }

        /* --- END SCREEN --- */
        #result-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #064E3B; /* Dark green */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            padding: 32px;
            color: #FFF;
        }

        .trophy {
            width: 160px;
            height: 160px;
            margin-bottom: 24px;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .result-score {
            font-size: 48px;
            font-weight: 800;
            color: #FDE047;
            margin-bottom: 16px;
            text-shadow: 0 4px 12px rgba(253, 224, 71, 0.2);
        }

        .result-subtitle {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #D1FAE5;
        }

        .badge {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            padding: 10px 20px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .result-btn {
            background-color: #FFF;
            color: #064E3B;
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            margin-bottom: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .result-btn.secondary {
            background-color: rgba(255,255,255,0.1);
            color: #FFF;
        }

        .result-btn:active {
            transform: scale(0.96);
        }

        /* --- ANIMATIONS --- */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .hide { display: none !important; }
        
        /* Confetti Canvas */
        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
        }

        /* Flat SVG illustrations styling */
        .svg-flat { width: 100%; height: 100%; }
        .svg-primary { fill: var(--primary); }
        .svg-secondary { fill: var(--secondary); }
        .svg-accent { fill: #FBBF24; }
        .svg-bg { fill: #E2E8F0; }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <header>
        <button class="icon-btn menu-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <h1 class="title">Міф чи правда?</h1>
        <div class="book-icon-wrapper">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>

    <!-- Quiz View -->
    <div id="quiz-view">

            <span class="progress-text" id="progress-text">Питання 1 із 10</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>

        <main>
            <div class="card" id="main-card">
                <!-- Flat illustration Placeholder -->
                <div class="illustration" id="illustration-container">
                    <!-- Dynamic SVG injected here -->
                </div>
                
                <h2 class="question-text" id="question-text">Завантаження...</h2>

                <!-- Feedback Area (hidden by default) -->
                <div class="feedback-container" id="feedback-container">
                    <div class="feedback-icon" id="feedback-icon">
                        <!-- Icon injected via JS -->
                    </div>
                    <h3 class="feedback-title" id="feedback-title">Правильно!</h3>
                    <p class="explanation" id="explanation-text"></p>

                    <div class="fact-card">
                        <div class="fact-header">
                            <div class="fact-icon">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="9" y1="18" x2="15" y2="18"></line>
                                    <line x1="10" y1="22" x2="14" y2="22"></line>
                                    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>
                                </svg>
                            </div>
                            <span class="fact-title">Цікавий факт</span>
                        </div>
                        <p class="fact-text" id="fact-text"></p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls" id="controls">
                <button class="btn btn-myth" onclick="handleAnswer(false)" id="btn-myth">❌ Міф</button>
                <button class="btn btn-truth" onclick="handleAnswer(true)" id="btn-truth">✅ Правда</button>
            </div>
            <button class="btn btn-next" onclick="nextQuestion()" id="btn-next">Наступне питання →</button>
        </main>
    </div>

    <!-- Results View -->
    <div id="result-view">
        <canvas id="confetti"></canvas>
        <div class="trophy">
            <!-- Modern flat trophy SVG -->
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="svg-flat">
                <path d="M8 21H16" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 17V21" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 4H17V8C17 10.7614 14.7614 13 12 13V13C9.23858 13 7 10.7614 7 8V4Z" fill="#FDE047" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M7 5H4C3.44772 5 3 5.44772 3 6C3 7.65685 4.34315 9 6 9H7" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 5H20C20.5523 5 21 5.44772 21 6C21 7.65685 19.6569 9 18 9H17" stroke="#FDE047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h2 class="result-title">Вітаємо!</h2>
        <div class="result-score" id="final-score">10 із 10</div>
        <p class="result-subtitle">Ви справжній знавець сучасних бібліотек!</p>
        <div class="badge">🏆 Хранитель знань</div>
        <button class="result-btn" onclick="resetGame()">Пройти ще раз</button>
        <button class="result-btn secondary" onclick="shareResult()">Поділитися результатом</button>
    </div>
</div>

            illustration: svgLibrary,
            explanation: "Вони залишилися переважно як історичні артефакти. Основою сучасного пошуку є виключно електронні системи.",
            factText: "Сучасні автоматизовані бібліотечні інформаційні системи дозволяють за мілісекунди шукати дані серед мільйонів метаданих."
        },
        {
            text: "Деякі сучасні бібліотеки дозволяють орендувати гаджети: ноутбуки чи електронні книги.",
            isTrue: true,
            illustration: svgLaptop,
            explanation: "Бібліотеки намагаються забезпечити рівний доступ до технологій, надаючи техніку у тимчасове користування.",
            factText: "В рамках проєкту «Дія.Цифрова освіта» багато українських бібліотек стали хабами, де кожен може скористатися технікою та навчитися цифрових навичок."
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    // DOM Elements
    const qText = document.getElementById('question-text');
    const illustrationContainer = document.getElementById('illustration-container');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progressBar');
    const controls = document.getElementById('controls');
    const btnNext = document.getElementById('btn-next');
    const btnMyth = document.getElementById('btn-myth');
    const btnTruth = document.getElementById('btn-truth');
    
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackTitle = document.getElementById('feedback-title');
    const explanationText = document.getElementById('explanation-text');
    const factText = document.getElementById('fact-text');
    
    const quizView = document.getElementById('quiz-view');
    const resultView = document.getElementById('result-view');
    const finalScore = document.getElementById('final-score');

    const iconCorrectSVG = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const iconIncorrectSVG = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

    function initGame() {
        currentQuestionIndex = 0;
        score = 0;
        resultView.style.display = 'none';
        quizView.style.display = 'block';
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentQuestionIndex];
        
        // Reset UI
        qText.style.display = 'block';
        feedbackContainer.style.display = 'none';
        controls.style.display = 'flex';
        btnNext.style.display = 'none';
        btnMyth.disabled = false;
        btnTruth.disabled = false;
        
        // Setup data
        qText.innerText = q.text;
        illustrationContainer.innerHTML = q.illustration;
        
        // Update Progress
        const qNum = currentQuestionIndex + 1;
        progressText.innerText = `Питання ${qNum} із ${questions.length}`;
        document.getElementById('progress-bar').style.width = `${(qNum / questions.length) * 100}%`;
    }

    function handleAnswer(userChoiceIsTrue) {
        const q = questions[currentQuestionIndex];
        const isCorrect = userChoiceIsTrue === q.isTrue;
        
        // Update Score
        if (isCorrect) score++;

        // Disable buttons
        btnMyth.disabled = true;
        btnTruth.disabled = true;

        // Hide question text to make room for feedback & fact
        qText.style.display = 'none';

        // Setup Feedback
        feedbackIcon.className = `feedback-icon ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackIcon.innerHTML = isCorrect ? iconCorrectSVG : iconIncorrectSVG;
        
        feedbackTitle.className = `feedback-title ${isCorrect ? 'correct' : 'incorrect'}`;
        feedbackTitle.innerText = isCorrect ? "Правильно!" : "Не зовсім…";
        
        explanationText.innerText = q.explanation;
        factText.innerText = q.factText;

        // Show Feedback and Next Button
        controls.style.display = 'none';
        feedbackContainer.style.display = 'flex';
        btnNext.style.display = 'flex';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex >= questions.length) {
            showResults();
        } else {
            renderQuestion();
        }
    }

    function showResults() {
        quizView.style.display = 'none';
        resultView.style.display = 'flex';
        finalScore.innerText = `${score} із ${questions.length}`;
        triggerConfetti();
    }

    function resetGame() {
        initGame();
    }

    function shareResult() {
        if (navigator.share) {
            navigator.share({
                title: 'Мій результат у грі про сучасні бібліотеки',
                text: `Я відповів правильно на ${score} з ${questions.length} питань у грі «Міф чи правда?»! Виявляється, сучасні бібліотеки дуже круті.`,
                url: window.location.href
            }).catch(console.error);
        } else {
            alert('Функція поширення не підтримується вашим браузером. Розкажіть друзям особисто! 😉');
        }
    }

    // --- Lightweight Confetti ---
    function triggerConfetti() {
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const pieces = [];
        const colors = ['#FDE047', '#22A06B', '#2D7FF9', '#EF4444', '#FFFFFF'];

        for (let i = 0; i < 100; i++) {
            pieces.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: Math.random() * 3 + 2,
                vx: Math.random() * 2 - 1,
                rot: Math.random() * 360,
                rotSpeed: Math.random() * 5 - 2.5
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            pieces.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                p.rot += p.rotSpeed;
                if (p.y < canvas.height) active = true;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
            });

            if (active) requestAnimationFrame(update);
        }
        update();
    }

    // Start
    window.onload = initGame;
</script>

</body>
</html>
